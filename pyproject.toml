[project]
name = "tickertutor"
version = "0.1.0"
description = "Ticker Tutor: learn to analyze S&P 500 stocks yourself. Common analyses explained, plus a deep-research agent team over prices, SEC filings, and news."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.0",
    "fastapi>=0.162.0",
    "google-cloud-storage>=3.17.1",
    "google-genai>=2.34.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "playwright>=1.64.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore:Using `httpx` with `starlette.testclient`"]
